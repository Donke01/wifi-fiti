<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WiFi Fiti · PPPoE Admin</title><style>body{font:15px system-ui;max-width:1100px;margin:auto;padding:24px;background:#f4f8fd;color:#162640}.panel{background:#fff;border:1px solid #dce7f3;border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card{padding:12px;background:#f7faff;border:1px solid #e2eaf4;border-radius:10px}button{padding:8px 12px;border:0;border-radius:7px;background:#1464d2;color:#fff;font-weight:700;margin:2px}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:left;border-bottom:1px solid #e7edf5}.muted{color:#6b83a2}input{padding:8px;border:1px solid #cbd9ea;border-radius:7px}</style><h1>PPPoE administration</h1><section id="login" class="panel"><p>Protected router access management</p><input id="token" type="password" placeholder="Admin token"> <button id="open">Open</button><p id="error"></p></section><main id="app" hidden><section class="panel"><h2>Profiles</h2><div id="profiles"></div></section><section class="panel"><h2>Subscribers</h2><div><input id="filter" placeholder="Search subscriber" autocomplete="off"></div><div id="subs"></div></section></main><script>(function(){let token='',q=s=>document.querySelector(s),api=async(p,o={})=>{let r=await fetch(p,{headers:{'x-admin-token':token,...(o.body?{'Content-Type':'application/json'}:{})},...o}),b=await r.json();if(!r.ok)throw Error(b.error||'Request failed');return b},confirmCall=(p,b)=>{let c=prompt('Enter confirmation phrase to continue');if(!c)return;return api(p,{method:'POST',body:JSON.stringify({...b,confirmation:c})})},render=async()=>{try{let [pr,su]=await Promise.all([api('/api/admin/pppoe/profiles'),api('/api/admin/pppoe/subscribers')]);q('#profiles').innerHTML='<div class="grid">'+(pr.profiles||[]).map(x=>'<div class="card"><b>'+x.name+'</b><br>'+x.rate_limit+' · '+(x.active?'active':'disabled')+'</div>').join('')+'</div>';let rows=su.subscribers||[];q('#filter').oninput=()=>draw(rows);function draw(a){q('#subs').innerHTML='<table><tr><th>User</th><th>Profile</th><th>Status</th><th>Connection</th><th>Actions</th></tr>'+a.filter(x=>(x.username||'').toLowerCase().includes(q('#filter').value.toLowerCase())).map(x=>'<tr><td>'+x.username+'</td><td>'+x.profile_name+'</td><td>'+x.enabled?'enabled':'disabled'+'</td><td>'+x.connection_status+'</td><td><button data-id="'+x.id+'" data-a="toggle">Enable/disable</button> <button data-id="'+x.id+'" data-a="reset">Reset secret</button></td></tr>').join('')+'</table>'}draw(rows);q('#subs').onclick=async e=>{let id=e.target.dataset.id,a=e.target.dataset.a;if(!id)return;try{if(a==='toggle')await confirmCall('/api/admin/pppoe/subscribers/'+id+'/toggle',{});else await confirmCall('/api/admin/pppoe/subscribers/'+id+'/reset-secret',{});await render()}catch(err){q('#error').textContent=err.message}}}catch(e){q('#error').textContent=e.message}};q('#open').onclick=()=>{token=q('#token').value.trim();q('#login').hidden=true;q('#app').hidden=false;render()}})()</script>
