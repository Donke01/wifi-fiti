<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WiFi Fiti PPPoE</title><style>body{font:15px system-ui;max-width:1000px;margin:auto;padding:24px;background:#f4f8fd;color:#10233f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid #dce7f3;border-radius:16px;padding:20px;margin-bottom:16px}label{display:block;margin:10px 0}label span{display:block;font-size:12px;font-weight:700;color:#647995;margin-bottom:4px}input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd9ea;border-radius:8px}button{padding:10px 14px;border:0;border-radius:8px;background:#1769d2;color:#fff;font-weight:700;cursor:pointer}.msg{margin-top:10px;color:#08785b}.err{margin-top:10px;color:#b4233d}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e7edf5}@media(max-width:700px){.grid{grid-template-columns:1fr}body{padding:14px}}</style></head><body><header><h1>PPPoE access</h1><p>Enroll subscribers and provision their paired MikroTik router automatically.</p><a href="/business.html">Back to business dashboard</a></header><div id="app">Loading…</div><script>
(async function(){const token=localStorage.getItem('fiti_business_token')||'';const app=document.getElementById('app');const api=async(path,opt={})=>{const r=await fetch(path,{...opt,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'Request failed');return b};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const workspace=await api('/api/business/me');let state=await api('/api/business/pppoe');const locations=workspace.locations||workspace.business?.locations||[];function draw(){const profiles=state.profiles||[],users=state.users||[];app.innerHTML='<div class="grid"><section class="card"><h2>Create access profile</h2><form id="profile"><label><span>Name</span><input name="name" placeholder="Home 10 Mbps" required></label><label><span>Download rate</span><input name="downloadRate" placeholder="10M" required></label><label><span>Upload rate</span><input name="uploadRate" placeholder="5M" required></label><button>Create profile</button><div id="pm" class="msg"></div></form></section><section class="card"><h2>Enroll subscriber</h2><form id="user"><label><span>Router/location</span><select name="locationId">'+locations.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name||x.router_name||x.id)+'</option>').join('')+'</select></label><label><span>Access profile</span><select name="profileId">'+profiles.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+' · '+esc(x.download_rate)+'/'+esc(x.upload_rate)+'</option>').join('')+'</select></label><label><span>Username</span><input name="username" placeholder="customer001" required></label><label><span>Password</span><input name="secret" type="password" minlength="8" required></label><button>Enroll and provision</button><div id="um" class="msg"></div></form></section></div><section class="card"><h2>Subscribers</h2><table><thead><tr><th>Username</th><th>Router</th><th>Profile</th><th>Status</th><th></th></tr></thead><tbody>'+ (users.map(x=>'<tr><td>'+esc(x.username)+'</td><td>'+esc(x.location_id)+'</td><td>'+esc((profiles.find(p=>p.id===x.profile_id)||{}).name||'—')+'</td><td>'+esc(x.status)+'</td><td><button data-id="'+esc(x.id)+'">Provision</button></td></tr>').join('')||'<tr><td colspan="5">No subscribers yet.</td></tr>')+'</tbody></table></section>';document.getElementById('profile').onsubmit=async e=>{e.preventDefault();try{await api('/api/business/pppoe/profiles',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await refresh();document.getElementById('pm').textContent='Profile created.'}catch(x){document.getElementById('pm').className='err';document.getElementById('pm').textContent=x.message}};document.getElementById('user').onsubmit=async e=>{e.preventDefault();try{const u=(await api('/api/business/pppoe/users',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))})).user;await api('/api/business/pppoe/users/'+encodeURIComponent(u.id)+'/provision',{method:'POST',body:JSON.stringify({locationId:u.location_id})});await refresh();document.getElementById('um').textContent='Enrolled. The router will apply access on its next secure poll.'}catch(x){document.getElementById('um').className='err';document.getElementById('um').textContent=x.message}};document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{try{await api('/api/business/pppoe/users/'+encodeURIComponent(b.dataset.id)+'/provision',{method:'POST',body:'{}'});alert('Provisioning queued.')}catch(x){alert(x.message)}})}async function refresh(){state=await api('/api/business/pppoe');draw()}draw()}catch(e){app.innerHTML='<section class="card"><h2>Sign in required</h2><p>Open the business dashboard and sign in first.</p><a href="/business.html">Open dashboard</a></section>'}})();
</script></body></html>
