<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wi-Fi Fiti · PPPoE subscribers</title>
<script src="/fiti-actions.js"></script>
<script src="/team-gate.js"></script>
<link rel="stylesheet" href="/assets/fiti-motion.css">
<script src="/assets/fiti-motion.js" defer></script>
<style>
:root{color-scheme:light;--ink:#132742;--muted:#5b6d86;--line:#dce5f0;--bg:#f6f8fc;--card:#fff;--blue:#1769d8;--blue-soft:#eef4fd;--blue-ink:#16427f;
  --good-soft:#e6f6ef;--good-ink:#0e5f43;--warn-soft:#fff4dc;--warn-ink:#6b4500;--warn-line:#f0d48f;--bad-soft:#fdecef;--bad-ink:#8c2238;--shadow:0 18px 45px #183c6712}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.shell{width:min(1180px,100%);margin:auto;padding:24px 20px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;color:#fff;background:var(--blue);font-size:20px;font-weight:900}
.brand h1{margin:0;font-size:22px;letter-spacing:-.02em}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:650}
a{color:var(--blue)}
.back{padding:9px 12px;border:1px solid var(--line);border-radius:10px;color:#175aa7;background:#fff;font-weight:800;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.card h2{margin:0;font-size:18px;letter-spacing:-.01em}.card>p.lead{margin:4px 0 14px;color:var(--muted)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}.two{grid-template-columns:1fr 1fr}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:0 0 16px}
.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}.metric span{display:block;color:var(--muted);font-size:12px;font-weight:700}.metric strong{display:block;margin-top:4px;font-size:24px}
.banner{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;margin-bottom:16px;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn-ink)}.banner.good{background:var(--good-soft);color:var(--good-ink)}
.banner span{flex:1;min-width:220px}
button,.button{min-height:40px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:800;cursor:pointer;padding:0 14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button.secondary{background:#fff;color:#175aa7;border:1.5px solid #c8d5e6}button.small{min-height:34px;font-size:12px;padding:0 10px}
button:disabled{opacity:.55;cursor:not-allowed}
input,select{width:100%;min-height:42px;padding:8px 11px;border:1.5px solid #c8d5e6;border-radius:10px;color:var(--ink);background:#fff;font:inherit}
input[type=checkbox]{width:18px;height:18px;min-height:0;padding:0;accent-color:var(--blue)}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #9cc2f5;outline-offset:2px}
label span.l{display:block;margin-bottom:5px;color:#44597a;font-size:12px;font-weight:750}
.form{display:grid;gap:11px}.form .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}.check input{width:18px;height:18px;min-height:0;margin-top:2px;accent-color:var(--blue)}
.check b{display:block}.check small{display:block;color:var(--muted)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;margin-top:10px}
table{width:100%;border-collapse:collapse;min-width:920px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #e8eff6;vertical-align:top}
th{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:#f8fafd}td{font-size:13px}tr:last-child td{border-bottom:0}
td small{display:block;color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good-ink)}.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}.pill.bad{background:var(--bad-soft);color:var(--bad-ink)}.pill.info{background:var(--blue-soft);color:var(--blue-ink)}
.delivery{font-size:12px;font-weight:700}.delivery.ok{color:#08785b}.delivery.warn{color:#8a5800}.delivery.bad{color:#b6304a}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.filters button{min-height:34px;border-radius:999px;background:#fff;color:var(--ink);border:1.5px solid var(--line);font-size:12px}
.filters button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.msg{padding:10px 12px;border-radius:10px;font-size:13px;font-weight:700}.msg.ok{color:var(--good-ink);background:var(--good-soft)}.msg.err{color:var(--bad-ink);background:var(--bad-soft)}
.routers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0 0 16px}
.router-status{padding:14px 16px;border:1px solid #d7e4f1;border-left-width:4px;border-radius:14px;background:#fff}.router-status strong{display:block;margin-bottom:4px}
.router-status span{display:block;font-size:13px}.router-status small{display:block;margin-top:5px;color:#60768e;font-size:12px}
.router-status.ok{border-left-color:#16a47a}.router-status.warn{border-left-color:#e3a21a}.router-status.bad{border-left-color:#d4405c}
dialog{border:0;border-radius:18px;padding:0;width:min(460px,calc(100% - 24px));box-shadow:0 30px 80px -30px rgba(19,39,66,.7)}
dialog::backdrop{background:rgba(19,39,66,.35)}
dialog form{padding:20px}dialog h3{margin:0 0 4px;font-size:18px}dialog .sub{margin:0 0 14px;color:var(--muted);font-size:13px}
.preview{padding:11px 13px;border-radius:12px;background:var(--blue-soft);color:var(--blue-ink);font-size:13px}
.linkbox{display:flex;gap:8px}.linkbox input{font-size:12px}
.payments{display:grid;gap:0}.payments div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #edf2f8;font-size:13px}
.payments div:first-child{border-top:0}
.muted{color:var(--muted)}.hidden{display:none!important}
textarea{width:100%;padding:8px 11px;border:1.5px solid #c8d5e6;border-radius:10px;color:var(--ink);background:#fff;font:inherit;resize:vertical}
.requests{display:grid}.request{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid #edf2f8}
.request:first-child{border-top:0}.request .who{min-width:0;flex:1 1 260px}.request .who small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.request .actions{align-items:center}.request select.small-select{width:auto;min-height:34px;font-size:12px;padding:4px 8px}
a.button.secondary{background:#fff;color:#175aa7;border:1.5px solid #c8d5e6}a.button.small{min-height:34px;font-size:12px;padding:0 10px}
@media(max-width:900px){.two{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.export-wrap{position:relative;float:right;margin-left:8px}.export-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:50;display:grid;min-width:160px;padding:6px;border:1px solid #c8d5e6;border-radius:12px;background:#fff;box-shadow:0 14px 34px rgba(19,39,66,.18)}.export-menu[hidden]{display:none}.export-menu button{min-height:36px;padding:7px 12px;border:0;border-radius:8px;background:transparent;color:#132742;text-align:left;font-weight:700;cursor:pointer}.export-menu button:hover{background:#eef5ff;color:#175aa7}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" aria-hidden="true">↔</div><div><h1>PPPoE subscribers</h1><small>Wi-Fi Fiti for Business</small></div></div>
    <a class="back" href="/business.html#pppoe">← Back to dashboard</a>
  </header>
  <section id="app" aria-live="polite"><div class="card muted">Loading your workspace…</div></section>
</main>

<dialog id="pay-dialog"><form method="dialog" id="pay-form" class="form">
  <div><h3>Record a payment</h3><p class="sub" id="pay-sub"></p></div>
  <div class="pair">
    <label><span class="l">Paid until</span><input id="pay-until" disabled></label>
    <label><span class="l">Credit</span><input id="pay-credit" disabled></label>
  </div>
  <label><span class="l">Amount received (KES)</span><input id="pay-amount" inputmode="numeric" required></label>
  <label><span class="l">How they paid</span><select id="pay-method"><option value="cash">Cash</option><option value="mpesa_owner">M-Pesa to my own number</option><option value="bank">Bank transfer</option></select></label>
  <label><span class="l">Receipt or M-Pesa code (optional)</span><input id="pay-receipt" placeholder="e.g. QJK4X7T2LM" autocapitalize="characters"></label>
  <label><span class="l">Note (optional)</span><input id="pay-note" maxlength="200"></label>
  <div class="preview" id="pay-preview"></div>
  <div id="pay-msg"></div>
  <div class="actions"><button type="submit" value="save" id="pay-save">Save payment</button><button type="button" class="secondary" data-close>Cancel</button></div>
  <p class="muted" style="margin:0;font-size:12px">Payments by PayBill (username as account number) or the customer's pay link are added by themselves. Use this for cash or money sent to your own number.</p>
</form></dialog>

<dialog id="edit-dialog"><form method="dialog" id="edit-form" class="form">
  <div><h3>Edit subscriber</h3><p class="sub" id="edit-sub"></p></div>
  <label><span class="l">Full name</span><input id="edit-name" maxlength="80"></label>
  <label><span class="l">Phone (for reminders and receipts)</span><input id="edit-phone" type="tel" placeholder="07xx xxx xxx"></label>
  <label><span class="l">Plan (changes now, speed applies at once)</span><select id="edit-plan"></select></label>
  <label><span class="l">Plan from next renewal</span><select id="edit-next"></select></label>
  <label><span class="l">Installation fee still due (KES)</span><input id="edit-install" inputmode="numeric"></label>
  <div class="pair">
    <label><span class="l">Add free days</span><input id="edit-days" inputmode="numeric" placeholder="e.g. 2"></label>
    <label><span class="l">Reason</span><input id="edit-days-note" placeholder="e.g. outage" maxlength="200"></label>
  </div>
  <div id="edit-msg"></div>
  <div class="actions"><button type="submit" value="save">Save</button><button type="button" class="secondary" data-close>Cancel</button></div>
</form></dialog>

<script>
(function () {
  'use strict';
  var token = ''; try { token = localStorage.getItem('fiti_business_token') || ''; } catch (e) {}
  var app = document.getElementById('app');
  var state = null; var billing = null; var workspace = null; var filter = 'all'; var flash = null;
  // Connection requests from the "Home internet" page, and the one being
  // turned into a subscriber (it fills the add form).
  var requests = { requests: [], counts: {} }; var fromRequest = null;
  // What the signed-in person's role may do here (the server checks too).
  function can(permission) { return !window.FitiGate || window.FitiGate.can(workspace && workspace.member, permission); }
  var DAY = 86400000;

  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k]; if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v; else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    (children || []).forEach(function (c) { if (c !== null && c !== undefined && c !== false) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  function kes(n) { return 'KES ' + Math.round(Number(n) || 0).toLocaleString('en-KE'); }
  function day(iso) { return iso ? new Date(iso).toLocaleDateString('en-KE', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'Africa/Nairobi' }) : '—'; }
  function api(path, opt) {
    opt = opt || {};
    return fetch(path, { method: opt.method || 'GET', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: opt.body ? JSON.stringify(opt.body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (b) {
        if (!r.ok) {
          if (b.needs && window.FitiActions && !opt.retried) return window.FitiActions.open(b.needs, { message: b.error }).then(function (done) { if (done) return api(path, Object.assign({}, opt, { retried: true })); throw new Error(b.error || 'Request failed'); });
          var e = new Error(b.error || 'Request failed'); e.status = r.status; throw e;
        }
        return b;
      }); });
  }
  function load() {
    return Promise.all([api('/api/business/pppoe'), api('/api/business/pppoe/billing'),
      api('/api/business/pppoe/requests').catch(function () { return { requests: [], counts: {} }; })])
      .then(function (r) { state = r[0]; billing = r[1]; requests = r[2]; });
  }
  function reload(message) {
    return load().then(function () { flash = message || null; draw(); });
  }
  // Spreadsheet download (CSV) with the signed-in session.
  function download(path, filename, button) {
    var label = button.textContent; button.disabled = true; button.textContent = 'Preparing…';
    fetch(path, { headers: token ? { Authorization: 'Bearer ' + token } : {}, cache: 'no-store' }).then(function (r) {
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (b) { throw new Error(b.error || 'Could not download this file.'); });
      return r.blob().then(function (blob) { var a = document.createElement('a'); var url = URL.createObjectURL(blob); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 1000); });
    }).catch(function (e) { window.alert(e.message); }).then(function () { button.disabled = false; button.textContent = label; });
  }
  // Excel, PDF or CSV: a small menu under the button.
  function exportButton(path, filename, text) {
    var wrap = h('span', { class: 'export-wrap' });
    var menu = h('span', { class: 'export-menu', hidden: true, role: 'menu' }, [['xlsx', 'Excel (.xlsx)'], ['pdf', 'PDF'], ['csv', 'CSV']].map(function (choice) {
      return h('button', { type: 'button', role: 'menuitem', text: choice[1], onclick: function (event) {
        event.stopPropagation(); menu.hidden = true;
        download(path + '?format=' + choice[0], filename.replace(/\.csv$/, '') + '.' + choice[0], button);
      } });
    }));
    var button = h('button', { type: 'button', class: 'secondary small', text: (text || 'Export') + ' ▾', 'aria-haspopup': 'menu', onclick: function (event) { event.stopPropagation(); menu.hidden = !menu.hidden; } });
    document.addEventListener('click', function () { menu.hidden = true; });
    wrap.appendChild(button); wrap.appendChild(menu);
    return wrap;
  }
  function msg(box, text, ok) { box.textContent = ''; if (text) box.appendChild(h('div', { class: 'msg ' + (ok ? 'ok' : 'err'), role: ok ? 'status' : 'alert', text: text })); }

  var STATUS = {
    paid: ['Paid up', 'good'], due: ['Due soon', 'warn'], grace: ['Grace days', 'warn'], expired: ['Ended', 'bad'],
    awaiting_payment: ['Awaiting first payment', 'info'], no_expiry: ['No expiry', 'good'], disabled: ['Switched off', 'bad'],
  };
  var REASONS = { bridge_missing: 'The confirmed customer bridge is missing on the router. Re-confirm the router map.', subnet_clash: 'The PPPoE address range is already used on this router.',
    setup_failed: 'The router could not set up its PPPoE server.', router_rejected: 'The router rejected this subscriber. Check the username and profile.', secret_unreadable: 'The saved password could not be read. Set a new password.' };
  function locations() { return (workspace && (workspace.locations || (workspace.business && workspace.business.locations))) || []; }
  function routerName(id) { var r = (state.routers || []).filter(function (v) { return v.id === id; })[0] || locations().filter(function (v) { return v.id === id; })[0]; return r ? (r.name || r.router_name || id) : (id || '—'); }
  function delivery(u) {
    var r = (state.routers || []).filter(function (v) { return v.id === u.location_id; })[0];
    if (r && !r.ready && u.job_status !== 'acked') return ['Waiting: confirm this router’s map', 'warn'];
    if (!u.job_status) return u.status === 'awaiting_payment' ? ['Sent once paid', 'warn'] : ['Not sent', ''];
    if (u.job_status === 'acked') return [u.job_action === 'revoke' ? 'Off on the router' : 'On the router', 'ok'];
    if (u.job_status === 'failed') return ['Failed: ' + (REASONS[u.job_error] || 'the router did not apply it'), 'bad'];
    if (u.job_error) return ['Retrying: ' + (REASONS[u.job_error] || u.job_error), 'warn'];
    return ['Waiting for the router', 'warn'];
  }
  function profileName(id) { var p = (state.profiles || []).filter(function (x) { return x.id === id; })[0]; return p ? p.name : '—'; }
  function sub(u) { return (billing.subscribers || {})[u.id] || { billing: {} }; }

  // ---- Page ---------------------------------------------------------------
  // Who is signed in first: a role without PPPoE customers gets a plain
  // message instead of controls that would only be refused.
  api('/api/business/me').then(function (me) {
    workspace = me;
    if (!can('customers.view')) { window.FitiGate.blocked(app, me.member, { cardClass: 'card', linkClass: 'back', what: 'PPPoE subscribers are for the owner, a Manager or an Attendant.' }); return null; }
    return load().then(draw);
  }).catch(function (e) {
    app.textContent = '';
    if (e.status && e.status !== 401) { app.appendChild(h('section', { class: 'card' }, [h('h2', { text: 'Could not open this page' }), h('p', { class: 'lead', text: e.message }), h('a', { class: 'back', href: '/business.html', text: 'Back to the dashboard' })])); return; }
    app.appendChild(h('section', { class: 'card' }, [h('h2', { text: 'Sign in required' }), h('p', { class: 'lead', text: 'Open the business dashboard and sign in first.' }), h('a', { class: 'back', href: '/business.html', text: 'Open business dashboard' })]));
  });

  function draw() {
    app.textContent = '';
    var users = state.users || [];
    var counts = { paid: 0, due: 0, ended: 0, credit: 0 };
    users.forEach(function (u) { var b = sub(u).billing; if (b.status === 'paid' || b.status === 'no_expiry') counts.paid++; if (b.status === 'due') counts.due++; if (b.status === 'grace' || b.status === 'expired') counts.ended++; counts.credit += b.credit || 0; });
    if (!billing.serving) app.appendChild(h('div', { class: 'banner warn', role: 'status' }, [
      h('span', {}, [h('b', { text: 'Your PPPoE + Static IP plan has ended. ' }), 'Customer payments are refused until ' + (can('billing') ? 'you renew' : 'the owner renews') + ', so nobody pays for internet you cannot switch back on. PayBill or cash that still arrives is kept as the customer’s credit.']),
      !can('billing') ? null : h('button', { type: 'button', text: 'Renew plan', onclick: function () { if (window.FitiActions) window.FitiActions.open({ action: 'subscribe', service: 'pppoe', reason: 'expired' }).then(function (ok) { if (ok) reload('Plan renewed. Customer payments are open again.'); }); } }),
    ]));
    if (flash) app.appendChild(h('div', { class: 'banner good', role: 'status' }, [h('span', { text: flash })]));
    app.appendChild(h('section', { class: 'metrics' }, [
      metric('Subscribers', users.length), metric('Paid up', counts.paid), metric('Due in 3 days', counts.due), metric('Ended or in grace', counts.ended), metric('Credit held', kes(counts.credit)),
    ]));
    if ((state.routers || []).length) app.appendChild(routersSection());
    var open = openRequests();
    if (open) app.appendChild(h('div', { style: 'margin-bottom:16px' }, [requestsCard()]));
    app.appendChild(subscribersSection());
    // Cards a role can't use are left out: adding subscribers needs
    // customers.edit, plans and billing settings packages.edit, and the
    // payment list sales.view.
    row([can('customers.edit') ? addSubscriberCard() : null, can('packages.edit') ? plansCard() : null]);
    row([howCustomersPayCard(), can('packages.edit') ? settingsCard() : null]);
    row([can('packages.edit') ? homePageCard() : null, !open && (requests.requests || []).length ? requestsCard() : null]);
    if (can('sales.view')) app.appendChild(h('div', { style: 'margin-top:16px' }, [paymentsCard()]));
  }
  function row(cards) {
    cards = cards.filter(Boolean); if (!cards.length) return;
    app.appendChild(h('div', { class: cards.length > 1 ? 'grid two' : 'grid', style: 'margin-top:16px' }, cards));
  }
  function metric(label, value) { return h('div', { class: 'metric' }, [h('span', { text: label }), h('strong', { text: String(value) })]); }

  function routersSection() {
    return h('section', { class: 'routers', 'aria-label': 'Routers' }, state.routers.map(function (r) {
      var health = r.health; var live = health && health.status === 'online';
      var cls = r.ready ? (health ? (live ? 'ok' : 'bad') : 'warn') : 'bad';
      return h('article', { class: 'router-status ' + cls }, r.ready ? [
        h('strong', { text: r.name || r.id }),
        h('span', { text: health ? (live ? 'PPPoE server running · ' + (Number(health.activeSessions) || 0) + ' connected' : 'PPPoE server is off on this router') : 'Ready. Status appears after the router applies its first subscriber.' }),
        h('small', { text: 'Bridge ' + r.customerBridge + ' · addresses ' + r.subnet + (health ? ' · last report ' + health.lastSeenAt + ' UTC' : '') }),
      ] : [
        h('strong', { text: r.name || r.id }), h('span', { text: 'Confirm this router’s map first' }),
        h('small', { text: 'Subscribers can’t connect until the customer bridge is confirmed. Subscribers you add now are sent as soon as it is.' }),
        !can('map') ? null : h('button', { type: 'button', class: 'secondary small', style: 'margin-top:8px', text: 'Confirm router map', onclick: function () {
          if (window.FitiActions) window.FitiActions.open({ action: 'confirm_router_map', locationId: r.id }).then(function (ok) { if (ok) reload('Router map confirmed. Waiting subscribers are on their way to the router.'); });
        } }),
      ]);
    }));
  }

  // ---- Subscribers ---------------------------------------------------------
  function subscribersSection() {
    var users = (state.users || []).filter(function (u) {
      var s = sub(u).billing.status;
      if (filter === 'due') return s === 'due'; if (filter === 'ended') return s === 'grace' || s === 'expired';
      if (filter === 'awaiting') return s === 'awaiting_payment'; if (filter === 'credit') return (sub(u).billing.credit || 0) > 0;
      return true;

            h('b', { text: r.fullName }), ' ', h('span', { class: 'pill ' + st[1], text: st[0] }),
            h('small', { text: where }),
            h('small', { text: (r.plan ? r.plan.name + (r.plan.price ? ' · ' + kes(r.plan.price) : '') : 'No package chosen') + ' · ' + day(r.createdAt) }),
            r.note ? h('small', { text: '“' + r.note + '”' }) : null,
          ]),
          h('div', { class: 'actions' }, [
            h('a', { class: 'button secondary small', href: 'tel:' + r.phoneE164, text: 'Call ' + r.phone }),
            edit && r.status !== 'connected' && r.status !== 'declined' ? h('button', { type: 'button', class: 'small', text: 'Add as subscriber', onclick: function () {
              fromRequest = r; draw();
              var card = document.getElementById('add-card'); if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
              var first = document.querySelector('#add-subscriber input[name=username]'); if (first) setTimeout(function () { first.focus({ preventScroll: true }); }, 300);
            } }) : null,
            edit ? status : null,
          ]),
        ]);
      })),
    ]);
  }
  function homePageCard() {
    var s = billing.settings; var box = h('div');
    var on = h('input', { type: 'checkbox', checked: s.homePage });
    var headline = h('input', { maxlength: '90', value: s.homeHeadline || '', placeholder: 'Fast, reliable internet for your home' });
    var areas = h('textarea', { rows: '4', placeholder: 'One per line, e.g.\nMilimani\nSection 6\nKiminini' });
    areas.value = (s.homeAreas || []).join('\n');
    var fee = h('input', { inputmode: 'numeric', value: s.homeInstallFee == null ? '' : String(s.homeInstallFee), placeholder: 'e.g. 2500' });
    fee.addEventListener('input', function () { fee.value = fee.value.replace(/\D/g, '').slice(0, 7); });
    var link = h('input', { readonly: true, value: billing.homePage || '', 'aria-label': 'Home internet page address' });
    var save = h('button', { type: 'button', text: 'Save page', onclick: function () {
      save.disabled = true;
      api('/api/business/pppoe/billing/settings', { method: 'PUT', body: { homePage: on.checked, homeHeadline: headline.value, homeAreas: areas.value, homeInstallFee: fee.value === '' ? null : parseInt(fee.value, 10) } })
        .then(function (r) { billing.settings = r.settings; return reload(r.settings.homePage ? 'Home internet page saved. It is live.' : 'Home internet page saved. It is off.'); })
        .catch(function (e) { msg(box, e.message); }).then(function () { save.disabled = false; });
    } });
    return h('section', { class: 'card', id: 'home-page' }, [
      h('h2', { text: 'Home internet page' }),
      h('p', { class: 'lead', text: 'A public page with your priced plans, how to pay, answers to common questions and a “Get connected” form. Requests appear here.' }),
      h('div', { class: 'form' }, [
        h('label', { class: 'check' }, [on, h('span', {}, [h('b', { text: 'Show the page' }), h('small', { text: 'Off: the address says the page was not found.' })])]),
        h('label', {}, [h('span', { class: 'l', text: 'Headline (optional)' }), headline]),
        h('label', {}, [h('span', { class: 'l', text: 'Areas you cover (optional, one per line)' }), areas]),
        h('p', { class: 'muted', style: 'margin:-4px 0 0', text: 'Customers pick one, or “Somewhere else” with their estate. Empty: they type their area.' }),
        h('label', {}, [h('span', { class: 'l', text: 'Installation fee to show (KES, optional)' }), fee]),
        s.homePage && billing.homePage ? h('label', {}, [h('span', { class: 'l', text: 'Page address' }), h('div', { class: 'linkbox' }, [link,
          h('button', { type: 'button', class: 'secondary small', text: 'Copy', onclick: function () { copyText(billing.homePage, box, 'Page address copied. Share it on WhatsApp, posters or your Wi‑Fi portal.'); } }),
          h('a', { class: 'button secondary small', href: billing.homePage, target: '_blank', rel: 'noopener', text: 'Open' })])]) : null,
        box, h('div', {}, [save]),
      ]),
    ]);
  }
  function copyText(text, box, done) {
    var ok = function () { msg(box, done, true); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, function () { prompt('Copy:', text); });
    else prompt('Copy:', text);
  }

  // ---- Payments -------------------------------------------------------------------
  function paymentsCard() {
    var list = billing.payments || [];
    var method = { mpesa: 'M-Pesa prompt', paybill: 'PayBill', cash: 'Cash', mpesa_owner: 'M-Pesa to you', bank: 'Bank', credit: 'From credit', owner: 'You' };
    return h('section', { class: 'card' }, [
      exportButton('/api/business/pppoe/export/payments', 'wifi-fiti-pppoe-payments.csv', 'Export all payments'),
      h('h2', { text: 'Recent payments' }),
      h('div', { class: 'payments' }, list.length ? list.map(function (p) {
        return h('div', {}, [
          h('span', {}, [h('b', { text: p.username + ' · ' }), p.what, h('small', { class: 'muted', style: 'display:block', text: day(p.at) + ' · ' + (method[p.method] || p.method) + (p.receipt ? ' · ' + p.receipt : '') + (p.payerPhone ? ' · paid by ' + p.payerPhone : '') + (p.note ? ' · ' + p.note : '') })]),
          h('strong', { style: p.reversed ? 'text-decoration:line-through' : '', text: p.amount ? kes(p.amount) : '—' }),
        ]);
      }) : [h('p', { class: 'muted', text: 'No PPPoE payments yet.' })]),
    ]);
  }
})();
</script>
</body>
</html>
