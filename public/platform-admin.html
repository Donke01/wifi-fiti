<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WiFi Fiti Platform Admin</title><style>body{font:15px system-ui;max-width:1200px;margin:auto;padding:24px;background:#f4f8fd;color:#162640}.panel{background:white;border:1px solid #dce7f3;border-radius:14px;padding:18px;margin:14px 0}.tabs button,button{padding:9px 13px;border:0;border-radius:8px;background:#1464d2;color:white;font-weight:700;margin:3px}.secondary{background:#eaf2ff!important;color:#1456a9!important}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.metric{padding:12px;background:#f7faff;border:1px solid #e2eaf4;border-radius:10px}.metric strong{display:block;font-size:24px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #e7edf5}th{font-size:11px;color:#6b83a2;text-transform:uppercase}.table{overflow:auto}input{padding:9px;border:1px solid #cbd9ea;border-radius:7px}</style><h1>WiFi Fiti <small>Platform Admin</small></h1><section id="login" class="panel"><p>Restricted control center</p><form id="login-form"><input id="token" type="password" placeholder="Admin token" required> <button>Open dashboard</button></form><p id="error"></p></section><div id="app" class="hidden"><nav class="tabs"><button data-tab="overview">Overview</button><button data-tab="tenants" class="secondary">Tenants</button><button data-tab="locations" class="secondary">Routers &amp; locations</button><button data-tab="transactions" class="secondary">Payments</button><button data-tab="packages" class="secondary">Packages</button><button data-tab="onboarding" class="secondary">Onboarding</button><button data-tab="support" class="secondary">Support</button><button data-tab="sms" class="secondary">SMS</button></nav><section id="overview" class="panel"><h2>Operations overview</h2><div id="metrics" class="grid"></div></section><section id="tenants" class="panel hidden"><h2>Tenants</h2><div id="tenant-table" class="table"></div></section><section id="locations" class="panel hidden"><h2>Routers &amp; locations</h2><div id="location-table" class="table"></div></section><section id="transactions" class="panel hidden"><h2>Payments</h2><div id="transaction-table" class="table"></div></section><section id="packages" class="panel hidden"><h2>Packages</h2><div id="package-table" class="table"></div></section><section id="onboarding" class="panel hidden"><h2>Onboarding</h2><div id="onboarding-table" class="table"></div></section><section id="support" class="panel hidden"><h2>Support</h2><div id="support-table" class="table"></div></section><section id="sms" class="panel hidden"><h2>FitiSignal SMS</h2><a href="/fiti-signal-admin.html">Open SMS control view →</a></section></div><script>(function(){let t='',q=s=>document.querySelector(s),api=async p=>{let r=await fetch(p,{headers:{'x-admin-token':t}}),b=await r.json();if(!r.ok)throw Error(b.error||'Request failed');return b},tbl=(id,h,rs)=>q(id).innerHTML='<table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rs.map(r=>'<tr>'+r.map(x=>'<td>'+String(x??'—')+'</td>').join('')+'</tr>').join('')+'</table>';async function load(){try{let [o,a,l,x,p,n,s]=await Promise.all(['/api/admin/platform/overview','/api/admin/platform/tenants','/api/admin/platform/locations','/api/admin/platform/transactions','/api/admin/platform/packages','/api/admin/platform/onboarding','/api/admin/platform/support'].map(api));q('#login').classList.add('hidden');q('#app').classList.remove('hidden');let z=o.summary;q('#metrics').innerHTML=Object.entries({Tenants:z.tenants,Locations:z.locations,'Routers online':z.onlineLocations,'Paid payments':z.paidTransactions,'Pending payments':z.pendingTransactions,'Open support':z.openTickets}).map(([k,v])=>'<div class="metric">'+k+'<strong>'+v+'</strong></div>').join('');tbl('#tenant-table',['Tenant','Email','Plan','State','Locations'],a.tenants.map(v=>[v.name,v.email,v.plan,v.onboarding_state,v.locations]));tbl('#location-table',['Business','Location','Router','Status','Health'],l.locations.map(v=>[v.business_name,v.name,v.router_name,v.status,v.router_setup_health]));tbl('#transaction-table',['Time','Business','Phone','Package','Amount','Status'],x.transactions.map(v=>[v.created_at,v.business_name,v.phone,v.package_name,v.amount,v.status]));tbl('#package-table',['Tenant','Package','Price','Seconds','Active'],p.packages.map(v=>[v.business_name,v.name,v.price,v.seconds,v.active]));tbl('#onboarding-table',['State','Count'],n.states.map(v=>[v.state,v.count]).concat(n.routers.map(v=>['Router '+v.state,v.count])));tbl('#support-table',['Tenant','Subject','Category','Status'],s.tickets.map(v=>[v.business_name,v.subject,v.category,v.status]))}catch(e){q('#error').textContent=e.message}}q('#login-form').onsubmit=e=>{e.preventDefault();t=q('#token').value.trim();load()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('#app>section').forEach(s=>s.classList.toggle('hidden',s.id!==b.dataset.tab));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('secondary',x!==b))})})();</script>
