<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wi-Fi Fiti · Admin Command Center</title>
<style>
:root{--ink:#10233f;--muted:#647995;--line:#dce7f3;--blue:#1769d2;--red:#b4233d;--green:#08785b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f4f8fd,#eef7fb);color:var(--ink);font:15px Inter,system-ui,-apple-system,sans-serif}button,input{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:white;font-weight:800;cursor:pointer}button.secondary{color:#175aa7;background:#eaf2ff}button.danger{background:var(--red)}.shell{max-width:1440px;margin:auto;padding:28px}.login{max-width:440px;margin:12vh auto;padding:34px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 60px #1d47751a}.login h1{margin:0 0 8px}.login p,.sub{color:var(--muted);line-height:1.5}.login input{width:100%;padding:13px;border:1px solid #cbd9ea;border-radius:10px;margin:12px 0}.login button{width:100%}.error{color:var(--red);min-height:20px;margin-top:12px}.app{display:none}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand h1{margin:0;font-size:30px;letter-spacing:-.05em}.brand small{color:var(--muted);font-weight:600}.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px #234a7510}.metric{padding:17px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:7px;font-size:28px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tabs button{background:#eaf2ff;color:#175aa7}.tabs button.active{background:var(--blue);color:#fff}.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}.panel{padding:20px}.panel h2{margin:0 0 14px;font-size:20px}.toolbar{display:flex;gap:9px;margin-bottom:12px}.toolbar input{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px}.list{display:grid;gap:8px;max-height:620px;overflow:auto}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;border:1px solid #e4edf6;border-radius:12px;background:#fbfdff;cursor:pointer}.row:hover{border-color:#8db8ee;background:#f2f7ff}.row b{display:block}.row small{display:block;color:var(--muted);margin-top:3px}.pill{padding:5px 8px;border-radius:99px;font-size:11px;font-weight:800;background:#e8f8f1;color:var(--green);white-space:nowrap}.pill.offline{background:#fff0f2;color:var(--red)}.detail{min-height:500px}.detail h3{margin:0 0 5px;font-size:25px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.fact{padding:11px;border:1px solid var(--line);border-radius:11px;background:#fbfdff}.fact span{display:block;color:var(--muted);font-size:11px}.fact b{display:block;margin-top:4px;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.section{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}.section p{color:var(--muted);line-height:1.5}@media(max-width:1000px){.metrics{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:600px){.shell{padding:14px}.metrics{grid-template-columns:repeat(2,1fr)}.facts{grid-template-columns:1fr}.brand{align-items:flex-start;gap:12px;flex-direction:column}}
 .login,.brand,.panel>h2,.panel>p{text-align:center}.login input{text-align:left}.metrics,.facts{justify-items:stretch}.metric,.fact{text-align:center}.actions,.tabs{justify-content:center}.list,.toolbar{text-align:left}
</style></head><body>
<section id="login" class="login"><h1>Wi-Fi Fiti Admin</h1><p>Secure platform command center. Use your administrator password.</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="Administrator password" required><button>Open command center</button></form><div id="loginError" class="error"></div></section>
<main id="app" class="app shell"><header class="brand"><div><h1>Wi-Fi Fiti <span style="color:var(--blue)">Command Center</span></h1><small>Tenants · routers · payments · services · audit</small></div><button id="lock" class="secondary">Lock dashboard</button></header><section id="metrics" class="metrics"></section><nav class="tabs"><button data-tab="tenants" class="active">Tenants</button><button data-tab="routers">Routers &amp; locations</button><button data-tab="payments">Payments</button><button data-tab="audit">Audit log</button><a href="/pppoe-admin.html"><button type="button" class="secondary">PPPoE</button></a></nav><div class="layout"><section class="panel"><div class="toolbar"><input id="search" placeholder="Search tenants or routers…"><button id="refresh" class="secondary">Refresh</button></div><div id="list" class="list"></div></section><section id="detail" class="panel detail"><h2>Select a tenant or router</h2><p class="sub">Choose an item to view its controls, diagnostics, services, and audit history.</p></section></div></main>
<script>
(function(){let password='',tab='tenants',data={tenants:[],locations:[],transactions:[],audit:[]};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function headers(json){return {'x-admin-password':password,...(json?{'Content-Type':'application/json'}:{})}}async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{...headers(Boolean(opt.body)),...(opt.headers||{})},cache:'no-store'});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'Request failed');return b}
async function load(){const [o,t,l,x,a]=await Promise.all([api('/api/admin/platform/overview'),api('/api/admin/platform/tenants'),api('/api/admin/platform/locations'),api('/api/admin/platform/transactions'),api('/api/admin/control-plane/audit')]);data={tenants:t.tenants||[],locations:l.locations||[],transactions:x.transactions||[],audit:a.events||[]};const s=o.summary;$('#metrics').innerHTML=Object.entries({Tenants:s.tenants,Locations:s.locations,'Routers online':s.onlineLocations,'Paid payments':s.paidTransactions,'Active subscriptions':s.activeSubscriptions,'Revenue (KES)':s.revenueKes}).map(([k,v])=>`<div class="metric"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('');renderList()}
function renderList(){const q=$('#search').value.toLowerCase();let rows=tab==='tenants'?data.tenants.filter(x=>JSON.stringify(x).toLowerCase().includes(q)):tab==='routers'?data.locations.filter(x=>JSON.stringify(x).toLowerCase().includes(q)):tab==='payments'?data.transactions.filter(x=>JSON.stringify(x).toLowerCase().includes(q)):data.audit.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('#list').innerHTML=rows.map((x,i)=>tab==='tenants'?`<div class="row" data-i="${i}"><div><b>${esc(x.name)}</b><small>${esc(x.email)} · ${esc(x.plan||'no plan')} · ${x.locations} router(s)</small></div><span class="pill">${esc(x.onboarding_state||'active')}</span></div>`:tab==='routers'?`<div class="row" data-i="${i}"><div><b>${esc(x.name||x.router_name||'Router')}</b><small>${esc(x.business_name)} · ${esc(x.router_model||'MikroTik')}</small></div><span class="pill ${x.status==='offline'?'offline':''}">${esc(x.status||'unknown')}</span></div>`:tab==='payments'?`<div class="row" data-i="${i}"><div><b>${esc(x.business_name)} · KES ${esc(x.amount)}</b><small>${esc(x.phone)} · ${esc(x.package_name)}</small></div><span class="pill ${x.status!=='paid'?'offline':''}">${esc(x.status)}</span></div>`:`<div class="row" data-i="${i}"><div><b>${esc(x.action)}</b><small>${esc(x.business_id||'platform')} · ${esc(x.created_at)}</small></div><span class="pill">audit</span></div>`).join('')||'<p class="sub">No matching records.</p>';$('#list').querySelectorAll('.row').forEach(el=>el.onclick=()=>select(rows[Number(el.dataset.i)]))}
async function select(x){if(tab==='tenants'){renderTenant(x);return}if(tab==='routers'){try{renderRouter(await api('/api/admin/control-plane/locations/'+encodeURIComponent(x.id)+'/diagnostics'))}catch(e){$('#detail').innerHTML=`<div class="error">${esc(e.message)}</div>`}return}$('#detail').innerHTML=`<h3>${esc(tab==='payments'?'Payment':'Audit event')}</h3><pre>${esc(JSON.stringify(x,null,2))}</pre>`}
function renderTenant(x){$('#detail').innerHTML=`<h3>${esc(x.name)}</h3><p class="sub">${esc(x.email)} · Tenant ID ${esc(x.id)}</p><div class="facts"><div class="fact"><span>Plan</span><b>${esc(x.plan||'—')}</b></div><div class="fact"><span>Billing</span><b>${esc(x.billing_status||'—')}</b></div><div class="fact"><span>Routers</span><b>${esc(x.locations)}</b></div><div class="fact"><span>Revenue</span><b>KES ${esc(x.revenue_kes||0)}</b></div></div><div class="actions"><button data-action="billing">Edit billing</button><button data-action="sessions" class="danger">Revoke sessions</button></div><div class="section"><h2>Tenant services</h2><p>Packages, payments, SMS usage, PPPoE subscribers, portals, and router locations are scoped to this tenant.</p><a href="/pppoe-admin.html"><button class="secondary">Open PPPoE controls</button></a></div>`;bindTenant(x)}
function renderRouter(d){const x=d.location;$('#detail').innerHTML=`<h3>${esc(x.name||x.routerName||'Router')}</h3><p class="sub">${esc(x.businessName)} · ${esc(x.routerModel||'MikroTik')} · ${esc(x.routerStatus||'unknown')}</p><div class="facts"><div class="fact"><span>Last contact</span><b>${esc(x.lastRouterContactAt||'—')}</b></div><div class="fact"><span>Health</span><b>${esc(x.setupHealth||'—')}</b></div><div class="fact"><span>Portal</span><b>${esc(x.portalHostname||'Not configured')}</b></div><div class="fact"><span>Pending jobs</span><b>${esc(d.jobs.pending)}</b></div><div class="fact"><span>Active subscriptions</span><b>${esc(d.subscriptions.active)}</b></div></div><div class="actions"><button data-action="portal">Set portal address</button><button data-action="rotate">Rotate token</button><button data-action="offboard" class="danger">Delete / quarantine router</button></div><div class="section"><h2>Router diagnostics</h2><p>Setup verified: ${x.setupVerifiedAt?'yes':'no'} · Portal applied: ${d.onboarding.portalApplied?'yes':'no'} · Pairing pending: ${d.onboarding.pairingPending?'yes':'no'}</p></div>`;bindRouter(x)}
function confirmPassword(){return window.prompt('Enter administrator password to confirm this action')||null}function bindTenant(x){$('#detail').querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{try{const p=confirmPassword();if(!p)return;if(b.dataset.action==='sessions')await api('/api/admin/control-plane/tenants/'+encodeURIComponent(x.id)+'/revoke-sessions',{method:'POST',body:JSON.stringify({adminPassword:p})});else{const plan=prompt('Plan name',x.plan||'');if(!plan)return;await api('/api/admin/control-plane/tenants/'+encodeURIComponent(x.id)+'/billing',{method:'PATCH',body:JSON.stringify({plan,adminPassword:p})})}alert('Action completed and audited.');await load()}catch(e){alert(e.message)}})}function bindRouter(x){$('#detail').querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{try{const p=confirmPassword();if(!p)return;let path,body={adminPassword:p},method='POST';if(b.dataset.action==='portal'){const slug=prompt('Portal slug',String(x.portalHostname||'').split('.')[0]);if(!slug)return;path='/api/admin/control-plane/locations/'+encodeURIComponent(x.id)+'/portal';body.slug=slug;method='PATCH'}else if(b.dataset.action==='rotate'){path='/api/admin/control-plane/locations/'+encodeURIComponent(x.id)+'/pairing-token/rotate';body.intent='ROTATE PAIRING TOKEN'}else{path='/api/admin/control-plane/locations/'+encodeURIComponent(x.id)+'/lifecycle/offboard';body.intent='OFFBOARD ROUTER'}await api(path,{method,body:JSON.stringify(body)});alert('Action completed and audited.');await load()}catch(e){alert(e.message)}})}
$('#loginForm').onsubmit=async e=>{e.preventDefault();password=$('#password').value;try{await load();$('#login').style.display='none';$('#app').style.display='block'}catch(e){$('#loginError').textContent='Administrator authentication failed.'}};$('#lock').onclick=()=>location.reload();$('#search').oninput=renderList;$('#refresh').onclick=load;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));renderList();$('#detail').innerHTML='<h2>Select a record</h2><p class="sub">Choose an item to view its controls.</p>'})})();
</script><script src="/admin-modules.js"></script></body></html>
